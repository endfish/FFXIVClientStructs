name: Push Build

on: push

permissions:
  contents: read

concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/composites/update-dotnet
      - name: Install dependencies
        run: dotnet restore ./FFXIVClientStructs.slnx
      - name: Run CExporter
        working-directory: ./
        run: dotnet run --project CExporter/CExporter.csproj -c Release
      - name: Validate CExporter diagnostics
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' ./ida/errors.txt > ./ida/errors.normalized.txt

          {
            echo "### CExporter diagnostics"
            echo
            echo "The CN branch keeps a reviewed diagnostic baseline. Any addition, removal, or change must be reviewed explicitly."
            echo
            echo '```text'
            if [ -s ./ida/errors.normalized.txt ]; then
              cat ./ida/errors.normalized.txt
            else
              echo "No layout diagnostics."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! diff -u ./.github/cexporter-known-errors.txt ./ida/errors.normalized.txt; then
            echo "::error::CExporter diagnostics differ from the reviewed CN baseline."
            exit 1
          else
            echo "CExporter diagnostics match the reviewed CN baseline."
          fi
